name: Quality Gate & Tests

# The release pipeline (build_apk.yml) only runs on main and only builds. This workflow is the
# cheap, always-on half: the mechanical AGENTS.md rules, the JVM unit tests, and a compile so a
# PR can never land something that does not even build.

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: AGENTS.md rules (grep gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No JDK, no SDK: this is the feedback loop that should answer in seconds.
      - name: Run quality gate
        run: bash scripts/quality-gate.sh

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (app + common)
        run: ./gradlew :app:common:testDebugUnitTest testDebugUnitTest --no-daemon --stacktrace

  build:
    name: Compile (debug) + Android lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # debug builds are wired to debug.keystore in app/build.gradle.kts; generate the standard
      # debug key when the repo copy is absent, same as build_apk.yml does.
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -alias androiddebugkey
          fi

      - name: Compile debug
        run: ./gradlew :app:compileDebugKotlin :app:common:compileDebugKotlin --no-daemon --stacktrace

      - name: Android lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
